name: Arweave Name Token

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'spec/**'
      - 'test/**'
      - 'tools/**'
      - '*.rockspec'
      - 'package.json'
      - 'yarn.lock'
      - 'version.mjs'
      - 'ao-build-config.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/**'
      - 'spec/**'
      - 'test/**'
      - 'tools/**'
      - '*.rockspec'
      - 'package.json'
      - 'yarn.lock'
      - 'version.mjs'
      - 'ao-build-config.yml'

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: Check out repository code

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.3' # Specify the Lua version you need

      - name: Setup LuaRocks

        uses: leafo/gh-actions-luarocks@v4.3.0

      - name: Install Busted
        run: luarocks install ar-io-ao-0.1-1.rockspec

      - name: Run Busted Tests
        run: busted .

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.3'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4.3.0

      - name: Install Luacheck
        run: luarocks install luacheck

      - run: luacheck src spec

  # TODO: add ar-io-sdk e2e tests against lua code to be bundled on changes (e.g. create a new ant, publish it and validate it works with the sdk)

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.0.2
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn --frozen-lockfile
      - name: Install AO Tool
        run: |
          curl -L https://install_ao.arweave.net | sh
          export AO_INSTALL=/home/runner/.ao
          export PATH="$AO_INSTALL/bin:$PATH"
          echo "AO_INSTALL=$AO_INSTALL" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
      - name: Verify AO Installation
        run: ao -V
      - run: yarn copy-aos-process
      - run: yarn module:build
      - run: yarn test
  check-should-publish:
    runs-on: ubuntu-latest
    outputs:
      lua_changes: ${{ steps.filter.outputs.lua_changes }}
      version_changes: ${{ steps.filter.outputs.version_changes }}
      build_config_changes: ${{ steps.filter.outputs.build_config_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Lua file and build config changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lua_changes:
              - '**/*.lua'
            version_changes:
              - 'version.mjs'
            build_config_changes:
              - 'ao-build-config.yml'
  publish:
    needs: [lint, unit, integration, check-should-publish]
    if:
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' ||
      github.event_name == 'workflow_dispatch') &&
      (needs.check-should-publish.outputs.lua_changes == 'true' ||
      needs.check-should-publish.outputs.version_changes == 'true' ||
      needs.check-should-publish.outputs.build_config_changes == 'true')
    uses: ./.github/workflows/publish.yaml
    secrets: inherit
    with:
      propose: false

  notify:
    runs-on: ubuntu-latest
    needs: [unit, integration, publish]
    if: always()
    steps:
      - name: Notify Slack on Success
        if:
          (github.ref_name == 'main' || github.ref_name == 'develop') &&
          needs.unit.result == 'success' && needs.integration.result ==
          'success'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Unit Tests: ${{ needs.unit.result }}
            Integration Tests: ${{ needs.integration.result }}
            Published Lua Id: ${{ needs.publish.outputs.published_lua_code_id || 'N/A' }}
            Published Module Id: ${{ needs.publish.outputs.published_module_id || 'N/A' }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Unit Tests: ${{ needs.unit.result }}
            Integration Tests: ${{ needs.integration.result }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
